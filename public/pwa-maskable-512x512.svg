<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg_mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#061f1a"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
    <linearGradient id="gold_mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="beam_mask" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe area -->
  <rect width="512" height="512" fill="url(#bg_mask)"/>

  <!-- Safe Zone centered elements (all within 80% circle) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <polygon points="256,40 100,440 412,440" fill="url(#beam_mask)"/>
    <g opacity="0.4">
      <line x1="140" y1="260" x2="140" y2="400" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
      <rect x="126" y="290" width="28" height="80" rx="4" fill="#10b981"/>
      <line x1="200" y1="200" x2="200" y2="380" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
      <rect x="186" y="240" width="28" height="100" rx="4" fill="#f43f5e"/>
      <line x1="260" y1="160" x2="260" y2="360" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
      <rect x="246" y="190" width="28" height="120" rx="4" fill="#10b981"/>
      <line x1="320" y1="130" x2="320" y2="340" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
      <rect x="306" y="150" width="28" height="140" rx="4" fill="#10b981"/>
      <line x1="380" y1="90" x2="380" y2="320" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
      <rect x="366" y="110" width="28" height="170" rx="4" fill="#10b981"/>
    </g>

    <path d="M 120 370 Q 230 330, 310 210 L 390 120" fill="none" stroke="url(#gold_mask)" stroke-width="18" stroke-linecap="round"/>
    <polygon points="410,100 340,115 375,150" fill="url(#gold_mask)"/>

    <circle cx="256" cy="270" r="56" fill="#090d16" stroke="url(#gold_mask)" stroke-width="8"/>
    <text x="256" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#gold_mask)" text-anchor="middle">$</text>
  </g>
</svg>
