<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#061f1a"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Spotlight Cone -->
  <polygon points="256,40 100,440 412,440" fill="url(#beam)"/>

  <!-- Candlestick chart silhouettes in background -->
  <g opacity="0.4">
    <!-- Candle 1 -->
    <line x1="140" y1="260" x2="140" y2="400" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="126" y="290" width="28" height="80" rx="4" fill="#10b981"/>
    <!-- Candle 2 -->
    <line x1="200" y1="200" x2="200" y2="380" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/>
    <rect x="186" y="240" width="28" height="100" rx="4" fill="#f43f5e"/>
    <!-- Candle 3 -->
    <line x1="260" y1="160" x2="260" y2="360" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="246" y="190" width="28" height="120" rx="4" fill="#10b981"/>
    <!-- Candle 4 -->
    <line x1="320" y1="130" x2="320" y2="340" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="306" y="150" width="28" height="140" rx="4" fill="#10b981"/>
    <!-- Candle 5 -->
    <line x1="380" y1="90" x2="380" y2="320" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <rect x="366" y="110" width="28" height="170" rx="4" fill="#10b981"/>
  </g>

  <!-- Surging Golden Bull Arrow -->
  <path d="M 120 370 Q 230 330, 310 210 L 390 120" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow Head -->
  <polygon points="410,100 340,115 375,150" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Golden Dollar / Titan Emblem -->
  <circle cx="256" cy="270" r="56" fill="#090d16" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  <text x="256" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#gold)" text-anchor="middle">$</text>

  <!-- Glowing Crown/Stars above -->
  <polygon points="256,170 262,185 278,185 265,195 270,210 256,200 242,210 247,195 234,185 250,185" fill="#fde047" filter="url(#glow)"/>
  <polygon points="206,190 210,200 221,200 212,207 215,217 206,210 197,217 200,207 191,200 202,200" fill="#fde047"/>
  <polygon points="306,190 310,200 321,200 312,207 315,217 306,210 297,217 300,207 291,200 302,200" fill="#fde047"/>
</svg>
